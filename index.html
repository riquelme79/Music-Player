<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player">
    <div class="disco" id="disco"><div class="furo"></div></div>
    <h1 id="titulo">—</h1>
    <p id="artista">—</p>

    <div class="progresso">
      <span id="atual">0:00</span>
      <input id="barra" type="range" min="0" max="100" value="0" step="0.1" aria-label="Progresso">
      <span id="total">0:00</span>
    </div>

    <div class="controles">
      <button id="anterior" aria-label="Faixa anterior">⏮</button>
      <button id="voltar" aria-label="Voltar 10 segundos">−10s</button>
      <button id="play" class="principal" aria-label="Tocar">▶</button>
      <button id="avancar" aria-label="Avançar 10 segundos">+10s</button>
      <button id="proxima" aria-label="Próxima faixa">⏭</button>
    </div>

    <label class="volume">Volume
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
    </label>

    <ul id="lista" class="lista"></ul>
  </main>
  <audio id="audio" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
